[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webflow"
version = "0.1.0"
description = "Resumable LLM-driven web-flow agent that learns, caches and replays multi-step web forms."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "playwright>=1.48",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "SQLAlchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.54"]
anthropic = ["anthropic>=0.39"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/webflow", "src/providers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["webflow", "providers"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "live: hits the real internet; deselected by default (use -m live)",
]

[tool.coverage.run]
source = ["src"]
